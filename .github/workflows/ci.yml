# CI/CD Pipeline — SwiftPay Microservices
#
# Triggers on every push to main and on pull requests targeting main.
# Jobs:
#   1. lint-and-validate — renders the kustomize overlays and validates them
#      with kubeconform (offline). Runs on push AND PRs.
#   2. build-and-push — builds all 5 arm64 images on a native ARM runner and
#      pushes them to GHCR. Push to main only.
#   3. deploy — SSHes into the Oracle A1 k3s box, applies the prod overlay,
#      and rolls out. Push to main only, and only when deploy-relevant files
#      (services/**, k8s/**, this workflow) changed.
#
# Images are tagged with both the git SHA (immutable) and "latest" (mutable).
#
# GHCR is free for public repos and uses GITHUB_TOKEN automatically.
# Deploy needs 3 repo secrets: ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo-name" — used as the image namespace
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/swiftpay

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Validate Kubernetes manifests
  # Fast, no Docker required. Catches YAML typos
  # and invalid field names before any build runs.
  # ─────────────────────────────────────────────
  lint-and-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl (for kustomize build)
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        # kubeconform validates manifests against the Kubernetes OpenAPI schemas
        # entirely offline — no cluster connection needed.
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render overlays and validate
        # Build each Kustomize target and pipe the rendered manifests to
        # kubeconform. This validates EXACTLY what gets deployed (post-patch),
        # not the raw files. The postgres secret is applied out-of-band and
        # gitignored, so it's absent from the render — expected.
        # -ignore-missing-schemas skips CRDs we don't ship schemas for.
        run: |
          echo "== base =="
          kubectl kustomize k8s/base | kubeconform -ignore-missing-schemas -summary
          echo "== overlays/prod =="
          kubectl kustomize k8s/overlays/prod | kubeconform -ignore-missing-schemas -summary

  # ─────────────────────────────────────────────
  # JOB 2: Build and push Docker images to GHCR
  # Only runs on push to main (not PRs).
  # Builds all 5 images in parallel using a matrix.
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    # Native ARM64 runner — builds arm64 images without QEMU emulation.
    # Our only deploy target is the Oracle A1 (aarch64), so we build
    # arm64-only. Native build = no "qemu illegal instruction" crashes
    # and much faster than emulation.
    runs-on: ubuntu-24.04-arm
    # Skip this job on pull requests — only push to registry from main
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write  # required to push to GHCR

    strategy:
      # Build all 5 services in parallel. If one fails, others continue.
      fail-fast: false
      matrix:
        include:
          - service: main-service
            context: services/main
          - service: auth-service
            context: services/auth-service
          - service: wallet-service
            context: services/wallet-service
          - service: transaction-service
            context: services/transaction-service
          - service: payment-service
            context: services/payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extracts metadata to generate image tags automatically:
      #   - ghcr.io/owner/swiftpay-main-service:sha-abc1234  (immutable)
      #   - ghcr.io/owner/swiftpay-main-service:latest       (mutable)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # No QEMU needed — the runner is natively arm64.

      # BuildKit cache speeds up repeated builds significantly.
      # gha (GitHub Actions cache) stores layer cache between runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          # arm64-only: the Oracle A1 Ampere box is our sole deploy target.
          # Built natively on an arm64 runner (no emulation).
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to the Oracle A1 k3s cluster
  # Runs after images are built, only on push to main, and only when
  # deploy-relevant files changed (services, k8s manifests, or this
  # workflow). Connects over SSH (port 22 — no k8s API exposure) and
  # runs kubectl locally on the box.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Oracle k3s
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Decide whether deploy-relevant files changed on this push.
      # If not, later steps are skipped (build still ran, but no redeploy).
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy:
              - 'services/**'
              - 'k8s/**'
              - '.github/workflows/ci.yml'

      - name: Copy manifests to the box
        if: steps.changes.outputs.deploy == 'true'
        # scp the k8s/ dir (base + overlays). Secrets are managed on the box
        # out-of-band and never copied. Uses the SSH deploy key secret.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "k8s/"
          target: "~/swiftpay-server/"
          # Wipe the remote k8s dir first so deleted files don't linger
          rm: true

      - name: Apply overlay and roll out
        if: steps.changes.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=~/.kube/config
            cd ~/swiftpay-server
            # Apply the prod overlay (idempotent). Secrets/postgres-secret
            # already exist on the box and are untouched.
            kubectl apply -k k8s/overlays/prod
            # Force pods to re-pull :latest images built in this run.
            kubectl rollout restart deployment -n swiftpay
            # Wait for the rollout so a failed deploy fails the pipeline.
            kubectl rollout status deployment/main-service -n swiftpay --timeout=180s
