# EXAMPLE — copy to secret.yaml and set a real password, then apply manually:
#   kubectl apply -f k8s/base/infrastructure/postgres/secret.yaml
#
# The real secret.yaml is gitignored so the password never enters git.
# The app services' DATABASE_URL (in their own secrets) must use the SAME
# password you set here.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: swiftpay
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "swiftpaydb"
