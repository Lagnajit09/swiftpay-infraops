# INIT CONTAINERS — the key concept in this phase.
#
# The problem: auth-service needs its database TABLES to exist before it starts.
# Without them, Prisma throws an error on the first query and the app crashes.
# In docker-compose.dev.yml, the startup command was:
#   "npx prisma migrate deploy && npm run dev"
# — i.e., run migrations THEN start the app, chained in one process.
#
# In Kubernetes, each container in a pod has a single responsibility. You
# don't chain commands like that. Instead, Kubernetes gives you initContainers:
# a list of containers that run TO COMPLETION, IN ORDER, before the main
# container starts. If an init container fails, the pod restarts and tries again
# (with exponential backoff). The main container never sees a failed init.
#
# Flow for this pod:
#   1. [init] migrate → runs "npx prisma migrate deploy" → exits 0
#   2. [main] auth-service → starts and finds tables already created
#
# The init container uses the SAME IMAGE as the main container — the Prisma
# CLI and migration files are already baked in during the Docker build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: migrate
          image: swiftpay-auth:local
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            # DIRECT_URL is intentionally omitted here.
            # auth-service's prisma.config.ts sets shadowDatabaseUrl from DIRECT_URL,
            # and migrate deploy fails if shadowDatabaseUrl == DATABASE_URL.
            # The shadow database is only used by migrate dev (not migrate deploy),
            # so leaving DIRECT_URL unset is correct for production migrations.
      containers:
        - name: auth-service
          image: swiftpay-auth:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
