# This Secret holds the PostgreSQL superuser password.
# We keep it separate from the app service secrets because:
#   - the postgres StatefulSet itself reads POSTGRES_PASSWORD from here
#   - app services build their DATABASE_URL from this same password (Phase 3)
# Having one source of truth means changing the password = editing one object.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: swiftpay
type: Opaque
stringData:
  POSTGRES_PASSWORD: "swiftpay_pg_pass"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "swiftpaydb"
