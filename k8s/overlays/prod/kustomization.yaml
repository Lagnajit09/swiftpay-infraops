# PROD Overlay — patches the base for the Oracle A1 k3s cluster.
#
# What this changes vs base:
#   1. Image names: swiftpay-*:local  →  ghcr.io/lagnajit09/swiftpay-*:latest
#      The `images:` transformer rewrites EVERY occurrence of each image
#      name across all deployments AND init containers automatically.
#   2. imagePullPolicy is handled by the image tag: with a real registry
#      image, k3s pulls it. We keep :latest and rollout-restart on deploy
#      to pick up new builds.
#
# Apply with:  kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Strategic-merge patches for prod-specific overrides.
patches:
  # Ingress: Traefik class + TLS + swiftpay-api.duckdns.org host
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: swiftpay-ingress
  # ConfigMap: CORS FRONTEND_URL → Firebase Hosting app
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: main-service-config
  # ConfigMap: auth-service FRONTEND_URL → Firebase app (email links)
  - path: auth-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: auth-service-config
  # imagePullPolicy: Always on every container — so the mutable :latest tag
  # is actually re-pulled from GHCR on each rollout. Base uses IfNotPresent
  # (correct for local k3d side-loaded images), but with IfNotPresent+:latest
  # the kubelet keeps a stale cached image and never picks up new builds.
  # Inline patches: kustomize auto-targets each by its kind+metadata.name.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: main-service
        namespace: swiftpay
      spec:
        template:
          spec:
            containers:
              - name: main-service
                imagePullPolicy: Always
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
        namespace: swiftpay
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Always
            containers:
              - name: auth-service
                imagePullPolicy: Always
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wallet-service
        namespace: swiftpay
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Always
            containers:
              - name: wallet-service
                imagePullPolicy: Always
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transaction-service
        namespace: swiftpay
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Always
            containers:
              - name: transaction-service
                imagePullPolicy: Always
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
        namespace: swiftpay
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Always
            containers:
              - name: payment-service
                imagePullPolicy: Always

# Remap local image names to the GHCR images produced by CI.
# newName/newTag replace the image reference wherever the original
# `name` appears (main container + init container alike).
images:
  - name: swiftpay-main
    newName: ghcr.io/lagnajit09/swiftpay-main-service
    newTag: latest
  - name: swiftpay-auth
    newName: ghcr.io/lagnajit09/swiftpay-auth-service
    newTag: latest
  - name: swiftpay-wallet
    newName: ghcr.io/lagnajit09/swiftpay-wallet-service
    newTag: latest
  - name: swiftpay-transaction
    newName: ghcr.io/lagnajit09/swiftpay-transaction-service
    newTag: latest
  - name: swiftpay-payment
    newName: ghcr.io/lagnajit09/swiftpay-payment-service
    newTag: latest
